services:
  frontend:
    build: ./frontend
    container_name: frontend-service
    ports:
      - "8080:80"
    networks:
      - external-net
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:80/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  auth-service:
    build: ./auth
    container_name: auth-service
    ports:
      - "3001:3000"
    env_file:
      - ./auth/.env
    networks:
      - external-net
      - internal-net
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  settings-service:
    build: ./setting
    container_name: settings-service
    ports:
      - "4000:4000"
    env_file:
      - ./setting/.env
    networks:
      - internal-net
      - external-net
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:4000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  notification-service:
    build: ./notification
    container_name: notification-service
    ports:
      - "5000:5000"
    env_file:
      - ./notification/.env
    networks:
      - internal-net
      - external-net
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  upload-service:
    build: ./upload
    container_name: upload-service
    ports:
      - "6000:6000"
    env_file:
      - ./upload/.env
    networks:
      - internal-net
      - external-net
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:6000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal-net:
    driver: bridge
    internal: true
  external-net:
    driver: bridge

volumes:
  mongo_data:
