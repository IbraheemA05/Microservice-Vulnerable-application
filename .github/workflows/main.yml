name: Microservices-Vulnerable CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-secure:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read
      packages: write
      id-token: write #required for cosign

    steps:

      # ------------------------
      # LOGIN TO DOCKER
      # ------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # ------------------------
      # CHECKOUT CODE
      # ------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------
      # SETUP NODE
      # ------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ------------------------
      # SETUP SNYK CLI
      # ------------------------
      - name: Setup Snyk
        uses: snyk/actions/setup@master

      #-------------------------
      # SETUP SYFT CLI
      #-------------------------
      - name: Setup Syft
        uses: anchore/sbom-action@v0.16.0

      #-------------------------
      # AUTH & SETTINGS
      #-------------------------
      - name: Authenticate Snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk auth $SNYK_TOKEN

      # ------------------------
      # SAST (Code Analysis)
      # ------------------------
      - name: Run Snyk SAST (Auth & Settings)
        continue-on-error: true #This is use to ensure the build completes even if there are issues
        run: |
          cd auth && snyk code test \
          --json \
          > ../snyk-auth-sast.json 2>&1 || echo "Snyk scan found issues in auth"
          echo "SNYK_AUTH_SAST_JSON_FILE=snyk-auth-sast.json" >> $GITHUB_ENV

          cd ../setting && snyk code test \
          --json \
          > ../snyk-setting-sast.json 2>&1 || echo "Snyk scan found issues in setting"
          echo "SNYK_SETTING_SAST_JSON_FILE=snyk-setting-sast.json" >> $GITHUB_ENV
          
          cd ../upload && snyk code test \
          --json \
          > ../snyk-upload-sast.json 2>&1 || echo "Snyk scan found issues in upload"
          echo "SNYK_UPLOAD_SAST_JSON_FILE=snyk-upload-sast.json" >> $GITHUB_ENV
          
          cd ../frontend && snyk code test \
          --json \
          > ../snyk-frontend-sast.json 2>&1 || echo "Snyk scan found issues in frontend"
          echo "SNYK_FRONTEND_SAST_JSON_FILE=snyk-frontend-sast.json" >> $GITHUB_ENV
          
          cd ../notification && snyk code test \
          --json \
          > ../snyk-notification-sast.json 2>&1 || echo "Snyk scan found issues in notification"
          echo "SNYK_NOTIFICATION_SAST_JSON_FILE=snyk-notification-sast.json" >> $GITHUB_ENV

      #------------------------
      # Upload SAST Report
      #------------------------

      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-sast-report-${{ github.sha }}
          path: |
             snyk-auth-sast.json
             snyk-setting-sast.json
             snyk-frontend-sast.json
             snyk-upload-sast.json
             snyk-notification-sast.json
          retention-days: 1


      # ------------------------
      # SCA (Dependency Scan)
      # ------------------------
      - name: Run Snyk SCA
        continue-on-error: true #This is use to ensure the build completes even if there are issues
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth $SNYK_TOKEN

          cd auth
          snyk test \
            --severity-threshold=high \
            --json \
            > ../snyk-auth-sca.json 2>&1 || echo "Snyk found issues in auth"
          cd ..
          echo "SNYK_AUTH_SCA_JSON_FILE=snyk-auth-sca.json" >> $GITHUB_ENV

          cd setting
          snyk test \
            --severity-threshold=high \
            --json \
            > ../snyk-setting-sca.json 2>&1 || echo "Snyk found issues in setting"
          cd ..
          echo "SNYK_SETTING_SCA_JSON_FILE=snyk-setting-sca.json" >> $GITHUB_ENV

          cd upload
          snyk test \
            --severity-threshold=high \
            --json \
            > ../snyk-upload-sca.json 2>&1 || echo "Snyk found issues in upload"
          cd ..
          echo "SNYK_UPLOAD_SCA_JSON_FILE=snyk-upload-sca.json" >> $GITHUB_ENV

          cd frontend
          snyk test \
            --severity-threshold=high \
            --json \
            > ../snyk-frontend-sca.json 2>&1 || echo "Snyk found issues in frontend"
          cd ..
          echo "SNYK_FRONTEND_SCA_JSON_FILE=snyk-frontend-sca.json" >> $GITHUB_ENV

          cd notification
          snyk test \
            --severity-threshold=high \
            --json \
            > ../snyk-notification-sca.json 2>&1 || echo "Snyk found issues in notification"
          cd ..
          echo "SNYK_NOTIFICATION_SCA_JSON_FILE=snyk-notification-sca.json" >> $GITHUB_ENV

      - name: SCA Monitoring
        env:
          SNYK_ORG: ${{ secrets.SNYK_ORG }}
        run: |
          cd auth
          snyk monitor --org=$SNYK_ORG --project-name=auth-service
          cd ..

          cd setting
          snyk monitor --org=$SNYK_ORG --project-name=setting-service
          cd ..
          
      #------------------------
      # UPload Report SCA
      #------------------------

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-${{ github.sha }}
          path: |
             snyk-auth-sca.json
             snyk-setting-sca.json
             snyk-frontend-sca.json
             snyk-upload-sca.json
             snyk-notification-sca.json
          retention-days: 1

      # ------------------------
      # BUILD IMAGES
      # ------------------------
      - name: Build Docker Images
        run: |
          docker build -t auth-service:${{ github.sha }} ./auth
          docker build -t settings-service:${{ github.sha }} ./setting
          docker build -t frontend-service:${{ github.sha }} ./frontend
          docker build -t upload-service:${{ github.sha }} ./upload
          docker build -t notification-service:${{ github.sha }} ./notification



      # ------------------------
      # CONTAINER SCANNING
      # ------------------------
      - name: Snyk Container Scan
        continue-on-error: true #This is use to ensure the build completes even if there are issues
        run: |
          snyk container test auth-service:${{ github.sha }} \
            --severity-threshold=high \
            --json \
            > snyk-auth-container.json 2>&1 || echo "High impact vulnerability found in auth-service."
          cd ..
          echo "SNYK_AUTH_CONTAINER_JSON_FILE=snyk-auth-container.json" >> $GITHUB_ENV

          snyk container test settings-service:${{ github.sha }} \
            --severity-threshold=high \
            --json \
            > snyk-settings-container.json 2>&1  || echo "High impact vulnerability found in settings-service."
          cd ..
          echo "SNYK_SETTINGS_CONTAINER_JSON_FILE=snyk-settings-container.json" >> $GITHUB_ENV

          snyk container test frontend-service:${{ github.sha }} \
            --severity-threshold=high \
            --json \
            > snyk-frontend-container.json  2>&1  || echo "High impact vulnerability found in frontend-service."
          cd ..
          echo "SNYK_FRONTEND_CONTAINER_JSON_FILE=snyk-frontend-container.json" >> $GITHUB_ENV

          snyk container test upload-service:${{ github.sha }} \
            --severity-threshold=high \
            --json \
            > snyk-upload-container.json 2>&1 || echo "High impact vulnerability found in upload-service."
          cd ..
          echo "SNYK_UPLOAD_CONTAINER_JSON_FILE=snyk-upload-container.json" >> $GITHUB_ENV

          snyk container test notification-service:${{ github.sha }} \
            --severity-threshold=high \
            --json \
            > snyk-notification-container.json 2>&1 || echo "High impact vulnerability found in notification-service."
          cd ..
          echo "SNYK_NOTIFICATION_CONTAINER_JSON_FILE=snyk-notification-container.json" >> $GITHUB_ENV

      - name: Container Monitoring
        env:
          SNYK_ORG: ${{ secrets.SNYK_ORG }}
        run: |
          snyk container monitor auth-service:${{ github.sha }} \
          --org=$SNYK_ORG \
          --project-name=auth-service-image

          snyk container monitor settings-service:${{ github.sha }} \
          --org=$SNYK_ORG \
          --project-name=settings-service-image
          
      #--------------------------
      # UPLOADING Container SCanning
      #--------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: snyk-container-report-${{ github.sha }}
          path: |
            snyk-auth-container.json
            snyk-settings-container.json
            snyk-frontend-container.json
            snyk-upload-container.json
            snyk-notification-container.json
          retention-days: 1

    
      # ------------------------
      # MONITOR (DASHBOARD)
      # ------------------------
      # - name: Send Results to Snyk Dashboard
      #  run: |
      #   snyk monitor --project-name=auth-service
      #    snyk monitor --project-name=settings-service

      #------------------------
      # GENERATE SBOM WITH SYFT
      #------------------------
      - name: Generate SBOM with Syft
        run: |
          syft auth-service:${{ github.sha }} \
            -o cyclonedx-json=auth-service.sbom.json

          syft settings-service:${{ github.sha }} \
            -o cyclonedx-json=settings-service.sbom.json

          syft frontend-service:${{ github.sha }} \
            -o cyclonedx-json=frontend-service.sbom.json

          syft upload-service:${{ github.sha }} \
            -o cyclonedx-json=upload-service.sbom.json

      #------------------------
      # UPLOAD  
      #------------------------
      - name: Upload SBOM to Snyk
        if: always()
        run: |
          snyk sbom test \
          --file=auth-service.sbom.json \
          --project-name=auth-service

          snyk sbom test \
          --file=settings-service.sbom.json \
          --project-name=settings-service

          snyk sbom test \
          --file=frontend-service.sbom.json \
          --project-name=frontend-service

          snyk sbom test \
          --file=upload-service.sbom.json \
          --project-name=upload-service

      - name: Upload SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            auth-service.sbom.json
            settings-service.sbom.json
            frontend-service.sbom.json
            upload-service.sbom.json

      #-------------------------
      # COSIGN AND SIGSTORE
      #-------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@main
        with:
          cosign-release: "v3.0.3"
      - name: Check Version
        run: cosign version

      - name: Build & Push Image
        run: |
          docker build -t docker.io/${{ secrets.DOCKER_USERNAME  }}/auth-service:${{ github.sha }} ./auth
          docker push docker.io/${{ secrets.DOCKER_USERNAME  }}/auth-service:${{ github.sha }}

          docker build -t docker.io/${{ secrets.DOCKER_USERNAME  }}/settings-service:${{ github.sha }} ./setting
          docker push docker.io/${{ secrets.DOCKER_USERNAME  }}/settings-service:${{ github.sha }}

          docker build -t docker.io/${{ secrets.DOCKER_USERNAME  }}/frontend-service:${{ github.sha }} ./frontend
          docker push docker.io/${{ secrets.DOCKER_USERNAME  }}/frontend-service:${{ github.sha }}

          docker build -t docker.io/${{ secrets.DOCKER_USERNAME  }}/upload-service:${{ github.sha }} ./upload
          docker push docker.io/${{ secrets.DOCKER_USERNAME  }}/upload-service:${{ github.sha }}

      - name: Add digest to image #Very important because cosign need the digest to sign the image and {{github.sha}} is mutable according to docker tag
        run: |
          AUTH_DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            docker.io/${{ secrets.DOCKER_USERNAME }}/auth-service:${{ github.sha }})

          SETTINGS_DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            docker.io/${{ secrets.DOCKER_USERNAME }}/settings-service:${{ github.sha }})

          FRONTEND_DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            docker.io/${{ secrets.DOCKER_USERNAME }}/frontend-service:${{ github.sha }})

          UPLOAD_DIGEST=$(docker inspect \
            --format='{{index .RepoDigests 0}}' \
            docker.io/${{ secrets.DOCKER_USERNAME }}/upload-service:${{ github.sha }})

          echo "AUTH_DIGEST=$AUTH_DIGEST" >> $GITHUB_ENV #Way github pass data to next step
          echo "SETTINGS_DIGEST=$SETTINGS_DIGEST" >> $GITHUB_ENV
          echo "FRONTEND_DIGEST=$FRONTEND_DIGEST" >> $GITHUB_ENV
          echo "UPLOAD_DIGEST=$UPLOAD_DIGEST" >> $GITHUB_ENV

      - name: Sign Image with consign
        env:
          COSIGN_EXPERIMENTAL: "true" #This is to acknowledge the experimental feature(keyless signing)
        run: |
          cosign sign $AUTH_DIGEST
          cosign sign $SETTINGS_DIGEST
          cosign sign $FRONTEND_DIGEST
          cosign sign $UPLOAD_DIGEST

      - name: Debug digests
        run: |
          echo "Auth digest: $AUTH_DIGEST"
          echo "Settings digest: $SETTINGS_DIGEST"
          echo "Frontend digest: $FRONTEND_DIGEST"
          echo "Upload digest: $UPLOAD_DIGEST"

      - name: Run DB Migrations
        run: |
          node db/migrate.js
        env:
          MONGO_URI: mongodb://mongo:27017
          MONGO_DB_NAME: microservices


      #------------------------------
      # DAST SCANNING
      #------------------------------
      # - name: OWASP ZAP BASELINE SCANNING
      #   uses: zaproxy/action-baseline@v0.14.0
      #   with:
      #     target: ${{}}
      #     token: ${{}}
      #     fail_action: false
      
      
  #-------------------------------
  # JOB 2 - Telegram Configuration
  #-------------------------------
  telegram:
      name: Telegram Notification
      runs-on: ubuntu-latest
      needs: [build-and-secure]

      permissions:
        contents: read
        security-events: write
        id-token: write

      steps:
      #--------------------------
      # Telegram SBOM 
      #--------------------------
      - name: Send Telegram Notification
        if: always()  # runs even on failure
        run: |
            STATUS="${{ job.status }}"
            REPO="${{ github.repository }}"
            RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
    
            MESSAGE="*CI/CD Report* 🚀
            Repo: $REPO
            Branch: ${{ github.ref_name }}
            Status: $STATUS
            [View Run]($RUN_URL)"
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
               -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -d text="$MESSAGE" \
               -d parse_mode="Markdown"

      #-----------------------------
      # SCA SCANNING REPORT
      #-----------------------------
      # ── Download report files from scan job ───────────
      - name: Download SCA reports
        uses: actions/download-artifact@v4
        with:
          name: snyk-report-${{ github.sha }}
          path: .

      # ── Send SCA reports to Telegram ───────────
      - name: Send SCA reports to Telegram
        run: |
          for FILE in \
            snyk-auth-sca.json \
            snyk-setting-sca.json \
            snyk-upload-sca.json \
            snyk-frontend-sca.json \
            snyk-notification-sca.json
          do
            if [ -f "$FILE" ]; then
              SERVICE=$(basename $FILE .json)   # e.g. snyk-auth-sca

              # Parse a human-readable summary from JSON
              SUMMARY=$(jq -r '. as $scan | ($scan.vulnerabilities // []) as $vulns | "🔍 SCA Report: " + $service + "\n📦 Project: " + ($scan.projectName // "unknown") + "\n📅 " + (now | strftime("%Y-%m-%d %H:%M UTC")) + "\n📊 Total: " + (($scan.uniqueCount // ($vulns | length)) | tostring) + "\n\n🚨 Critical: " + ([$vulns[] | select(.severity == "critical")] | length | tostring) + "\n🔴 High: " + ([$vulns[] | select(.severity == "high")] | length | tostring) + "\n🟡 Medium: " + ([$vulns[] | select(.severity == "medium")] | length | tostring) + "\n🟢 Low: " + ([$vulns[] | select(.severity == "low")] | length | tostring) + "\n\n" + (if ($vulns | length) == 0 then "✅ No vulnerabilities found" else "Top Vulns:\n" + ([$vulns[] | select(.severity == "critical" or .severity == "high")] | .[:5] | map("• " + .title + "\n  📦 " + .packageName + "@" + .version + "\n  🔗 " + ((.from // []) | join(" → ")) + "\n  ✅ Fix: upgrade to " + (.fixedIn[0] // "N/A") + "\n  🆔 " + ((.identifiers.CVE // [])[0] // .id // "N/A")) | join("\n\n")) end)' --arg service "$SERVICE" "$FILE")

              # Send summary as a text message
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode "text=${SUMMARY}"

              # Also send the raw JSON as a file for full details
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -F document=@"${FILE}" \
                -F caption="📎 Full raw report: ${FILE}"

              rm -f "$FILE"
              echo "$FILE sent and deleted."
            else
              echo "Skipping $FILE — not found."
            fi
          done

      #-----------------------------------------
      # CONTAINER SCANNING REPORT
      #-----------------------------------------
      # Downloading the report
      - name: Downloading Container Report
        uses: actions/download-artifact@v4
        with:
          name: snyk-container-report-${{ github.sha }}
          path: .

      # ── Send Container reports to Telegram ───────────
      - name: Send Container reports to Telegram
        run: |
          for FILE in \
            snyk-auth-container.json \
            snyk-settings-container.json \
            snyk-upload-container.json \
            snyk-frontend-container.json \
            snyk-notification-container.json
          do
            if [ -f "$FILE" ]; then
              SERVICE=$(basename $FILE .json)   # e.g. snyk-auth-container

              # Parse a human-readable summary from JSON
              SUMMARY=$(jq -r '. as $scan | ($scan.vulnerabilities // []) as $vulns | "🔍 Container Report: " + $service + "\n📦 Image: " + ($scan.imageName // "unknown") + "\n📅 " + (now | strftime("%Y-%m-%d %H:%M UTC")) + "\n📊 Total: " + (($scan.uniqueCount // ($vulns | length)) | tostring) + "\n\n🚨 Critical: " + ([$vulns[] | select(.severity == "critical")] | length | tostring) + "\n🔴 High: " + ([$vulns[] | select(.severity == "high")] | length | tostring) + "\n🟡 Medium: " + ([$vulns[] | select(.severity == "medium")] | length | tostring) + "\n🟢 Low: " + ([$vulns[] | select(.severity == "low")] | length | tostring) + "\n\n" + (if ($vulns | length) == 0 then "✅ No vulnerabilities found" else "Top Vulns:\n" + ([$vulns[] | select(.severity == "critical" or .severity == "high")] | .[:5] | map("• " + .title + "\n  📦 " + .packageName + "@" + .version + "\n  🔗 " + ((.from // []) | join(" → ")) + "\n  ✅ Fix: upgrade to " + (.fixedIn[0] // "N/A") + "\n  🆔 " + ((.identifiers.CVE // [])[0] // .id // "N/A")) | join("\n\n")) end)' --arg service "$SERVICE" "$FILE")

              # Send summary as a text message
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode "text=${SUMMARY}"

              # Also send the raw JSON as a file for full details
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -F document=@"${FILE}" \
                -F caption="📎 Full raw report: ${FILE}"

              rm -f "$FILE"
              echo "$FILE sent and deleted."
            else
              echo "Skipping $FILE — not found."
            fi
          done

      #------------------------------------
      #SAST SCANNING REPORT 
      #---------------------------------------
      # Downloading SAST reports
      - name: Download SAST reports
        uses: actions/download-artifact@v4
        with:
          name: sast-report-${{ github.sha }}
          path: .
        
    # ── Send SAST reports to Telegram ───────────
      - name: Send SAST reports to Telegram
        run: |
          for FILE in snyk-auth-sast.json \
            snyk-backend-sast.json \
            snyk-setting-sast.json \
            snyk-upload-sast.json \
            snyk-frontend-sast.json \
            snyk-notification-sast.json
          do
            if [ -f "$FILE" ]; then
              SERVICE=$(basename $FILE .json)   # e.g. snyk-auth-sast

              # Parse a human-readable summary from JSON
              SUMMARY=$(jq -r '. as $scan | ($scan.vulnerabilities // []) as $vulns | "🔍 SAST Report: " + $service + "\n📅 " + (now | strftime("%Y-%m-%d %H:%M UTC")) + "\n📊 Total: " + (($scan.uniqueCount // ($vulns | length)) | tostring) + "\n\n🚨 Critical: " + ([$vulns[] | select(.severity == "critical")] | length | tostring) + "\n🔴 High: " + ([$vulns[] | select(.severity == "high")] | length | tostring) + "\n🟡 Medium: " + ([$vulns[] | select(.severity == "medium")] | length | tostring) + "\n🟢 Low: " + ([$vulns[] | select(.severity == "low")] | length | tostring) + "\n\n" + (if ($vulns | length) == 0 then "✅ No vulnerabilities found" else "Top Vulns:\n" + ([$vulns[] | select(.severity == "critical" or .severity == "high")] | .[:5] | map("• " + .title + "\n  📦 " + .packageName + "@" + .version + "\n  🔗 " + ((.from // []) | join(" → ")) + "\n  ✅ Fix: upgrade to " + (.fixedIn[0] // "N/A") + "\n  🆔 " + ((.identifiers.CVE // [])[0] // .id // "N/A")) | join("\n\n")) end)' --arg service "$SERVICE" "$FILE")

              # Send summary as a text message
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                --data-urlencode "text=${SUMMARY}"

              # Also send the raw JSON as a file for full details
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" \
                -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                -F document=@"${FILE}" \
                -F caption="📎 Full raw report: ${FILE}"

              rm -f "$FILE"
              echo "$FILE sent and deleted."
            else
              echo "Skipping $FILE — not found."
            fi
          done

      #------------------------------------
      # SBOM REPORT 
      #---------------------------------------
      # Downloading SBOM reports
      - name: Download SBOM reports
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: .
        
    # ── Send SBOM reports to Telegram ───────────
      - name: Send SBOM reports to Telegram
        run: |
          for FILE in auth-service.sbom.json 
            settings-service.sbom.json 
            frontend-service.sbom.json 
            upload-service.sbom.json 
            notification-service.sbom.json
          do
            if [ -f "$FILE" ]; then
              SERVICE=$(basename $FILE .json)   # e.g. auth-service

              # Parse a human-readable summary from SBOM JSON
              SUMMARY=$(jq -r '". as $sbom | "📋 SBOM Report: " + $service + "\n📅 " + (now | strftime("%Y-%m-%d %H:%M UTC")) + "\n📦 Components: " + ((.components // []) | length | tostring) + "\n🔗 Dependencies: " + ((.dependencies // []) | length | tostring) + "\n📝 Format: CycloneDX" + "\n\n" + (if ((.components // []) | length) == 0 then "⚠️ No components found" else "📊 Component Summary:\n" + ([(.components // [])[] | select(.type == "library")] | group_by(.name) | map("• " + .[0].name + ": " + (length | tostring) + " version(s)") | .[:10] | join("\n")) end)' --arg service "$SERVICE" "$FILE")

              # Send summary as a text message
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" 
                -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" 
                --data-urlencode "text=${SUMMARY}"

              # Also send the raw SBOM as a file for full details
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument" 
                -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" 
                -F document=@"${FILE}" 
                -F caption="📎 Full SBOM: ${FILE}"

              rm -f "$FILE"
              echo "$FILE sent and deleted."
            else
              echo "Skipping $FILE — not found."
            fi
          done
          
 
    