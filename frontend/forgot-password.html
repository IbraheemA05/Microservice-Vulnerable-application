<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - MicroSec</title>
    <meta name="description" content="Reset your MicroSec password" />
    <link rel="stylesheet" href="css/simple-bw-auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <a href="index.html" class="auth-logo">
          <i class="fa-solid fa-shield-halved"></i>
          <span>MicroSec</span>
        </a>
        <h2>Reset Password</h2>
        <p class="auth-description">Enter your email and we'll send you a reset link.</p>
        
        <div id="form-feedback" class="form-feedback" style="display: none;"></div>
        
        <form id="forgot-password-form">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required />
          </div>
          <button type="submit" class="auth-btn">
            Send Reset Link <i class="fa-solid fa-paper-plane" style="margin-left: 0.5rem;"></i>
          </button>
        </form>
        
        <p class="auth-switch">
          Remember your password? <a href="login.html">Sign In</a>
        </p>
      </div>
    </div>
    
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
