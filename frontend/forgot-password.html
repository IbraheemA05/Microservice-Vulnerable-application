<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - Microservice App</title>
    <link rel="stylesheet" href="css/simple-bw-auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <h2>Reset Password</h2>
        <p class="auth-description">Enter your email and we'll send you a reset link.</p>
        <form id="forgot-password-form">
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <button type="submit" class="auth-btn">Send Reset Link</button>
        </form>
        <p class="auth-switch">
          Remember your password? <a href="login.html">Login</a>
        </p>
      </div>
    </div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
