<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - MicroSec</title>
    <meta name="description" content="Login to your MicroSec account" />
    <link rel="stylesheet" href="css/simple-bw-auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <a href="index.html" class="auth-logo">
          <i class="fa-solid fa-shield-halved"></i>
          <span>MicroSec</span>
        </a>
        <h2>Welcome Back</h2>
        <p class="auth-description">Sign in to continue to your dashboard</p>
        
        <div id="form-feedback" class="form-feedback" style="display: none;"></div>
        
        <form id="login-form">
          <div class="input-group">
            <label for="email">Email or Username</label>
            <input type="text" id="email" name="email" placeholder="Enter your email or username" required />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
          </div>
          <button type="submit" class="auth-btn">
            Sign In <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i>
          </button>
        </form>
        
        <p class="auth-switch">
          <a href="forgot-password.html">Forgot Password?</a>
        </p>
        <p class="auth-switch">
          Don't have an account? <a href="signup.html">Create Account</a>
        </p>
      </div>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
