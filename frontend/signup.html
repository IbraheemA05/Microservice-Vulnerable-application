<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - MicroSec</title>
    <meta name="description" content="Create your MicroSec account" />
    <link rel="stylesheet" href="css/simple-bw-auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <a href="index.html" class="auth-logo">
          <i class="fa-solid fa-shield-halved"></i>
          <span>MicroSec</span>
        </a>
        <h2>Create Account</h2>
        <p class="auth-description">Join the security research platform</p>
        
        <div id="form-feedback" class="form-feedback" style="display: none;"></div>
        
        <form id="signup-form">
          <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required />
          </div>
          <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required />
          </div>
          <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required />
          </div>
          <button type="submit" class="auth-btn">
            Create Account <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i>
          </button>
        </form>
        
        <p class="auth-switch">
          Already have an account? <a href="login.html">Sign In</a>
        </p>
      </div>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
