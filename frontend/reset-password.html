<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Password - MicroSec</title>
    <meta name="description" content="Create your new MicroSec password" />
    <link rel="stylesheet" href="css/simple-bw-auth.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <a href="index.html" class="auth-logo">
          <i class="fa-solid fa-shield-halved"></i>
          <span>MicroSec</span>
        </a>
        <h2>Create New Password</h2>
        <p class="auth-description">Enter your new password below.</p>
        
        <div id="form-feedback" class="form-feedback" style="display: none;"></div>
        
        <form id="reset-password-form">
          <input type="hidden" id="token" name="token" />
          <div class="input-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" placeholder="Create a strong password" required />
          </div>
          <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required />
          </div>
          <button type="submit" class="auth-btn">
            Reset Password <i class="fa-solid fa-check" style="margin-left: 0.5rem;"></i>
          </button>
        </form>
        
        <p class="auth-switch">
          Need a new reset link? <a href="forgot-password.html">Request Again</a>
        </p>
      </div>
    </div>
    
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
