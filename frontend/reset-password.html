<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Password - Microservice App</title>
    <link rel="stylesheet" href="css/simple-bw-auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <h2>Create New Password</h2>
        <p class="auth-description">Enter your new password below.</p>
        <form id="reset-password-form">
          <input type="hidden" id="token" name="token" />
          <div class="input-group">
            <label for="password">New Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <div class="input-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required />
          </div>
          <button type="submit" class="auth-btn">Reset Password</button>
        </form>
        <p class="auth-switch">
          Need a new reset link? <a href="forgot-password.html">Request Again</a>
        </p>
      </div>
    </div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
